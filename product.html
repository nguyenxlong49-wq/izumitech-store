            </div>

              </table>
            </div>
            <ul class="product-desc">

              <li>Giao nhanh 2h ná»™i thÃ nh HN/HCM, free ship Ä‘Æ¡n tá»« 500K</li>

              <li>Táº·ng kÃ¨m dÃ¡n mÃ n hÃ¬nh / vá»‡ sinh miá»…n phÃ­ trá»n Ä‘á»i mÃ¡y</li>
            </ul>
          </div>
        </div>
        <div class="comments">
          <h3>ðŸ’¬ ÄÃ¡nh giÃ¡ & bÃ¬nh luáº­n</h3>
          <div class="comment-form">
            <div style="display:flex;gap:10px">
              <input type="text" id="cName" placeholder="TÃªn cá»§a báº¡n" style="flex:1" />
              <select id="cRating"><option value="5">â˜…â˜…â˜…â˜…â˜… (5)</option><option value="4">â˜…â˜…â˜…â˜…â˜† (4)</option><option value="3">â˜…â˜…â˜…â˜†â˜† (3)</option><option value="2">â˜…â˜…â˜†â˜†â˜† (2)</option><option value="1">â˜…â˜†â˜†â˜†â˜† (1)</option></select>
            </div>
            <textarea id="cText" rows="3" placeholder="Chia sáº» cáº£m nháº­n cá»§a báº¡n vá» sáº£n pháº©m..."></textarea>
            <button class="btn btn-primary" id="cSubmit">Gá»­i Ä‘Ã¡nh giÃ¡</button>

          <div class="comment-list" id="cList"></div>
        </div>
        <div class="related" id="related"></div>
      `;
      $("#buyNow").addEventListener("click", ()=> doBuy(true));

        toast("Tráº£ gÃ³p 0%: tráº£ trÆ°á»›c 30%, cÃ²n láº¡i chia 6-12 thÃ¡ng. Gá»i 1900 6868 Ä‘á»ƒ duyá»‡t há»“ sÆ¡ 5 phÃºt ðŸ’³");

    function doBuy(isNow){

    }

    // cart drawer logic
    function updateCartUI(){
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      const count=Object.values(cart).reduce((s,q)=>s+(q.qty||0),0);
      const el=$("#cartCount"); if(el) el.textContent=count;
      const total=Object.entries(cart).reduce((s,[pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        return p?s+p.price*(q.qty||0):s;
      },0);
      const tc=$("#cartTotal"); if(tc) tc.textContent=vnd(total);
      const box=$("#cartItems");
      if(!box) return;
      const entries=Object.entries(cart);
      if(!entries.length){ box.innerHTML=`<p class="cart-empty">Giá» hÃ ng trá»‘ng ðŸ˜´</p>`; return; }
      box.innerHTML=entries.map(([pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        if(!p) return "";
        return `<div class="cart-item"><div class="ci-thumb" style="background:${p.color}">${p.icon}</div><div class="ci-info"><p class="ci-name">${p.name}</p><p class="ci-price">${vnd(p.price)} Ã— ${q.qty}</p></div></div>`;
      }).join("");
    }
    let tt;
    function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }
    $("#cartBtn")?.addEventListener("click",()=>$("#cartDrawer").classList.add("open"));
