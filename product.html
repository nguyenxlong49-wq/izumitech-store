<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm — IzumiTech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <div class="logo-col">
          <span class="logo-text">Izumi<span>Tech</span></span>
          <small class="slogan">Công nghệ xịn — Giá cực yêu</small>
        </div>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <a href="tel:19006868" class="hotline"><span class="hotline-icon">📞</span><span class="hotline-text"><small>Hotline 24/7</small><b>1900 6868</b></span></a>
        <a href="index.html" class="auth-btn">← Về cửa hàng</a>
        <button class="cart-btn" id="cartBtn">🛒<span class="cart-count" id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <main class="container" id="productRoot">
    <p class="muted" style="padding:20px 0">Đang tải sản phẩm...</p>
  </main>

  <div class="toast" id="toast"></div>
  <div class="postcard-overlay hidden" id="postcardOverlay"></div>
  <div class="postcard hidden" id="loginPostcard" aria-hidden="true">
    <button class="icon-btn" id="closePostcard" aria-label="Đóng" style="position:absolute;top:12px;right:12px">✕</button>
    <div style="font-size:2.2rem">🔒</div>
    <h3 style="margin-top:8px">Chưa đăng nhập</h3>
    <p class="muted" style="margin-top:6px">Hình như bạn chưa đăng nhập, vui lòng đăng nhập để mua sản phẩm này!</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <a href="login.html" class="btn btn-primary">Đăng nhập</a>
      <a href="signup.html" class="btn btn-ghost">Đăng ký</a>
    </div>
  </div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head"><h3>🛒 Giỏ hàng</h3><button class="icon-btn" id="closeCart">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot"><div class="cart-total-row"><span>Tạm tính</span><b id="cartTotal">0₫</b></div><button class="btn btn-primary btn-block" id="checkoutBtn">Thanh toán</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <script src="js/products.js"></script>
  <script>
    const API=(location.hostname==="localhost"||location.hostname==="127.0.0.1")?"http://localhost:5000":"https://izumitech-api.onrender.com";
    const $=s=>document.querySelector(s);
    const vnd=n=> new Intl.NumberFormat("vi-VN").format(n)+"₫";
    const params=new URLSearchParams(location.search);
    const id=params.get("id");

    let product=null;
    let allProducts=[];

    async function load(){
      try{
        const local = JSON.parse(localStorage.getItem("izumitech-products")||"null");
        allProducts = local && local.length ? local : (typeof DEFAULT_PRODUCTS !== "undefined" ? DEFAULT_PRODUCTS : []);
      }catch{ allProducts=(typeof DEFAULT_PRODUCTS !== "undefined" ? DEFAULT_PRODUCTS : []); }
      try{
        const r=await fetch(`${API}/api/products`);
        if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length) allProducts=d.map(p=>({...p,id:p._id||p.id})); }
      }catch{}
      product = allProducts.find(p=>String(p.id)===String(id));
      if(!product) { $("#productRoot").innerHTML=`<p style="padding:40px 0;text-align:center">Không tìm thấy sản phẩm 😢<br><a href="index.html" class="btn btn-primary" style="margin-top:12px">Về trang chủ</a></p>`; return; }
      render();
      renderRelated();
      renderComments();
      updateCartUI();
    }

    function stars(n){ return "★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n)); }

    function render(){
      const p=product;
      const disc = p.oldPrice ? Math.round((1-p.price/p.oldPrice)*100) : 0;
      const stockText = p.stock===0 ? `<span style="color:var(--danger);font-weight:700">● Hết hàng</span>` : (p.stock<5 ? `<span style="color:var(--warning);font-weight:700">● Sắp hết (còn ${p.stock})</span>` : `<span style="color:var(--accent)">● Còn hàng (${p.stock})</span>`);
      document.title = `${p.name} — IzumiTech`;
      $("#productRoot").innerHTML=`
        <div class="product-page">
          <div class="product-gallery">
            <div class="main-media" style="background:linear-gradient(145deg, ${p.color}, var(--surface))">
              ${p.image ? `<img src="${p.image}" alt="${p.name}" />` : p.icon}
              ${disc?`<span class="card-badge" style="top:12px;left:12px">-${disc}%</span>`:""}
            </div>
          </div>
          <div class="product-info">
            <span style="color:var(--accent);font-weight:700;font-size:0.82rem;text-transform:uppercase">${p.category}</span>
            <h1>${p.name}</h1>
            <div class="product-meta"><span class="stars">${stars(p.rating)}</span><span>${p.rating}</span><small>· Đã bán ${p.sold.toLocaleString("vi-VN")} · ${stockText}</small></div>
            <div class="product-price-box">
              <div><span class="price">${vnd(p.price)}</span> ${p.oldPrice?`<span class="price-old" style="margin-left:8px">${vnd(p.oldPrice)}</span>`:""}</div>
              <small class="muted">Giá đã bao gồm VAT • Bảo hành 12 tháng • Trả góp 0%</small>
              <div class="product-actions">
                <button class="btn btn-primary" id="buyNow" ${p.stock===0?'disabled style="opacity:0.5"':''}>Mua ngay</button>
                <button class="btn btn-ghost" id="buyInstall">Mua trả góp 0%</button>
                <button class="btn btn-ghost" id="addCartBtn" ${p.stock===0?'disabled':''}>＋ Thêm vào giỏ</button>
              </div>
            </div>
            <div class="specs-box">
              <h3>⚙️ Thông số kỹ thuật</h3>
              <table class="specs-table">
                ${Object.entries(p.specs||{}).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("") || `<tr><td colspan="2" class="muted">Chưa có thông số chi tiết</td></tr>`}
              </table>
            </div>
            <ul class="product-desc">
              <li>Bảo hành chính hãng 12 tháng, 1 đổi 1 trong 30 ngày nếu lỗi</li>
              <li>Giao nhanh 2h nội thành HN/HCM, free ship đơn từ 500K</li>
              <li>Trả góp 0% qua thẻ tín dụng hoặc duyệt online chỉ cần CCCD</li>
              <li>Tặng kèm dán màn hình / vệ sinh miễn phí trọn đời máy</li>
            </ul>
          </div>
        </div>
        <div class="comments">
          <h3>💬 Đánh giá & bình luận</h3>
          <div class="comment-form">
            <div style="display:flex;gap:10px">
              <input type="text" id="cName" placeholder="Tên của bạn" style="flex:1" />
              <select id="cRating"><option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option><option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option></select>
            </div>
            <textarea id="cText" rows="3" placeholder="Chia sẻ cảm nhận của bạn về sản phẩm..."></textarea>
            <button class="btn btn-primary" id="cSubmit">Gửi đánh giá</button>
          </div>
          <div class="comment-list" id="cList"></div>
        </div>
        <div class="related" id="related"></div>
      `;
      $("#buyNow").addEventListener("click", ()=> doBuy(true));
      $("#addCartBtn").addEventListener("click", ()=> doBuy(false));
      $("#buyInstall").addEventListener("click", ()=>{
        toast("Trả góp 0%: trả trước 30%, còn lại chia 6-12 tháng. Gọi 1900 6868 để duyệt hồ sơ 5 phút 💳");
      });
      $("#cSubmit").addEventListener("click", submitComment);
    }

    function doBuy(isNow){
      const user=JSON.parse(localStorage.getItem("izumitech-user")||"null");
      if(!user){ showLoginPostcard(); return; }
      if(product.stock===0){ toast("Sản phẩm đã hết hàng 😢"); return; }
      if(isNow){
        location.href=`checkout.html?id=${product.id}&qty=1`;
        return;
      }
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      const key=String(product.id);
      cart[key]= cart[key] ? {qty:cart[key].qty+1} : {qty:1};
      localStorage.setItem("izumitech-cart",JSON.stringify(cart));
      updateCartUI();
      toast(`Đã thêm "${product.name}" vào giỏ 🛒`);
    }

    function getComments(){
      try{ return JSON.parse(localStorage.getItem(`izumitech-comments-${id}`)||"[]"); }catch{ return []; }
    }
    function renderComments(){
      const list=getComments();
      const box=$("#cList");
      if(!list.length){ box.innerHTML=`<p class="muted">Chưa có bình luận nào — hãy là người đầu tiên! ✨</p>`; return; }
      box.innerHTML=list.map(c=>`
        <div class="comment-item">
          <div class="c-head"><span class="c-avatar">${(c.name?.trim()||"K")[0].toUpperCase()}</span><div><b>${c.name||"Khách"}</b><div class="c-stars">${stars(c.rating)} · ${new Date(c.date).toLocaleDateString("vi-VN")}</div></div></div>
          <p>${c.text}</p>
        </div>`).join("");
    }
    function submitComment(){
      const name=$("#cName").value.trim() || "Khách";
      const rating=Number($("#cRating").value);
      const text=$("#cText").value.trim();
      if(!text){ toast("Vui lòng nhập nội dung bình luận"); return; }
      const list=getComments();
      list.unshift({name,rating,text,date:new Date().toISOString()});
      localStorage.setItem(`izumitech-comments-${id}`,JSON.stringify(list));
      $("#cText").value="";
      renderComments();
      toast("Cảm ơn đánh giá của bạn! 💙");
    }

    function renderRelated(){
      const rel = allProducts.filter(p=>p.category===product.category && String(p.id)!==String(product.id)).slice(0,4);
      if(!rel.length) return;
      $("#related").innerHTML=`<h3>🔗 Sản phẩm liên quan</h3><div class="product-grid">${rel.map(p=>`
        <article class="card" onclick="location.href='product.html?id=${p.id}'" style="cursor:pointer">
          <div class="card-media" style="background:linear-gradient(145deg, ${p.color}, var(--surface));overflow:hidden">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover"/>`:p.icon}</div>
          <div class="card-body"><span class="card-cat">${p.category}</span><h3 class="card-title">${p.name}</h3><div class="card-price-row"><span class="price">${vnd(p.price)}</span></div></div>
        </article>`).join("")}</div>`;
    }

    function updateCartUI(){
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      const count=Object.values(cart).reduce((s,q)=>s+(q.qty||0),0);
      const el=$("#cartCount"); if(el) el.textContent=count;
      const total=Object.entries(cart).reduce((s,[pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        return p?s+p.price*(q.qty||0):s;
      },0);
      const tc=$("#cartTotal"); if(tc) tc.textContent=vnd(total);
      const box=$("#cartItems");
      if(!box) return;
      const entries=Object.entries(cart);
      if(!entries.length){ box.innerHTML=`<p class="cart-empty">Giỏ hàng trống 😴</p>`; return; }
      box.innerHTML=entries.map(([pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        if(!p) return "";
        return `<div class="cart-item"><div class="ci-thumb" style="background:${p.color}">${p.icon}</div><div class="ci-info"><p class="ci-name">${p.name}</p><p class="ci-price">${vnd(p.price)} × ${q.qty}</p></div></div>`;
      }).join("");
    }
    let tt;
    function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }
    function showLoginPostcard(){ document.getElementById("postcardOverlay")?.classList.remove("hidden"); document.getElementById("loginPostcard")?.classList.remove("hidden"); }
    function hideLoginPostcard(){ document.getElementById("postcardOverlay")?.classList.add("hidden"); document.getElementById("loginPostcard")?.classList.add("hidden"); }
    document.getElementById("closePostcard")?.addEventListener("click", hideLoginPostcard);
    document.getElementById("postcardOverlay")?.addEventListener("click", hideLoginPostcard);
    $("#cartBtn")?.addEventListener("click",()=>$("#cartDrawer").classList.add("open"));
    $("#closeCart")?.addEventListener("click",()=>$("#cartDrawer").classList.remove("open"));
    $("#overlay")?.addEventListener("click",()=>$("#cartDrawer").classList.remove("open"));
    $("#checkoutBtn")?.addEventListener("click",()=>{
      const user=JSON.parse(localStorage.getItem("izumitech-user")||"null");
      if(!user){ showLoginPostcard(); return; }
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      if(!Object.keys(cart).length){ toast("Giỏ hàng trống 🙂"); return; }
      location.href="checkout.html";
    });

    load();
  </script>
</body>
</html>
