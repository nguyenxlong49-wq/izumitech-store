<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm — IzumiTech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <div class="logo-col">
          <span class="logo-text">Izumi<span>Tech</span></span>
          <small class="slogan">Công nghệ xịn — Giá cực yêu</small>
        </div>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <a href="tel:19006868" class="hotline"><span class="hotline-icon">📞</span><span class="hotline-text"><small>Hotline 24/7</small><b>1900 6868</b></span></a>
        <a href="index.html" class="auth-btn">← Về cửa hàng</a>
        <button class="cart-btn" id="cartBtn">🛒<span class="cart-count" id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <main class="container" id="productRoot">
    <p class="muted" style="padding:20px 0">Đang tải sản phẩm...</p>
  </main>

  <div class="toast" id="toast"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head"><h3>🛒 Giỏ hàng</h3><button class="icon-btn" id="closeCart">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot"><div class="cart-total-row"><span>Tạm tính</span><b id="cartTotal">0₫</b></div><button class="btn btn-primary btn-block" id="checkoutBtn">Thanh toán</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <script>
    const API="http://localhost:5000";
    const $=s=>document.querySelector(s);
    const vnd=n=> new Intl.NumberFormat("vi-VN").format(n)+"₫";
    const params=new URLSearchParams(location.search);
    const id=params.get("id");

    const DEFAULT_PRODUCTS=[
      { id:1,name:"iPhone 15 Pro Max 256GB",category:"phone",price:29990000,oldPrice:34990000,rating:4.9,sold:1200,stock:15,icon:"📱",color:"#3b4a6b",specs:{"Chip":"A17 Pro 6 nhân","RAM":"8GB","Bộ nhớ":"256GB NVMe","Pin":"4422mAh, sạc nhanh 27W + MagSafe","Camera sau":"48MP + 12MP + 12MP tele 5x","Camera trước":"12MP TrueDepth","Màn hình":"6.7\" Super Retina XDR 120Hz","Loa":"Stereo Dolby Atmos","HĐH":"iOS 17"}},
      { id:2,name:"Samsung Galaxy S24 Ultra 512GB",category:"phone",price:27490000,oldPrice:31990000,rating:4.8,sold:890,stock:0,icon:"📱",color:"#5a3b6b",specs:{"Chip":"Snapdragon 8 Gen 3","RAM":"12GB","Bộ nhớ":"512GB UFS 4.0","Pin":"5000mAh, sạc 45W","Camera sau":"200MP + 12MP + 50MP + 10MP","Camera trước":"12MP","Màn hình":"6.8\" Dynamic AMOLED 2X 120Hz","Loa":"Stereo AKG"}},
      { id:3,name:"Xiaomi 14T Pro 5G 12GB/512GB",category:"phone",price:14990000,oldPrice:17990000,rating:4.7,sold:2100,stock:3,icon:"📱",color:"#2f5545",specs:{"Chip":"Dimensity 9300+","RAM":"12GB LPDDR5X","Bộ nhớ":"512GB UFS 4.0","Pin":"5000mAh, sạc 120W","Camera sau":"50MP Leica + 50MP + 12MP","Màn hình":"6.67\" AMOLED 144Hz","Loa":"Stereo Hi-Res"}},
      { id:4,name:"MacBook Air M3 13\" 8GB/256GB",category:"laptop",price:26990000,oldPrice:28990000,rating:4.9,sold:640,stock:8,icon:"💻",color:"#4a4a55",specs:{"Chip":"Apple M3 8/10 nhân","RAM":"8GB Unified","Ổ cứng":"256GB SSD","Pin":"52.6Wh ~18h","Màn hình":"13.6\" Liquid Retina","Loa":"4 loa Spatial Audio"}},
      { id:5,name:"ASUS ROG Strix G16 RTX 4070",category:"laptop",price:45990000,oldPrice:52990000,rating:4.8,sold:320,stock:0,icon:"💻",color:"#1f3a5f",specs:{"Chip":"i7-13650HX","Card":"RTX 4070 8GB","RAM":"16GB DDR5","Ổ cứng":"1TB NVMe","Màn hình":"16\" 2.5K 240Hz","Loa":"Dolby Atmos"}},
      { id:6,name:"Lenovo ThinkPad X1 Carbon Gen 12",category:"laptop",price:38990000,oldPrice:null,rating:4.7,sold:150,stock:12,icon:"💻",color:"#33383d",specs:{"Chip":"Core Ultra 7 155H","RAM":"32GB LPDDR5X","Ổ cứng":"1TB SSD","Màn hình":"14\" 2.8K OLED 120Hz","Loa":"Harman 4 loa"}},
      { id:7,name:"iPad Pro M4 11\" WiFi 256GB",category:"tablet",price:27990000,oldPrice:30990000,rating:4.9,sold:430,stock:5,icon:"📲",color:"#44465e",specs:{"Chip":"Apple M4","RAM":"8GB","Bộ nhớ":"256GB","Pin":"38.99Wh","Camera":"12MP + LiDAR","Màn hình":"11\" Ultra Retina XDR OLED","Loa":"4 loa"}},
      { id:8,name:"Samsung Galaxy Tab S9 FE+",category:"tablet",price:11990000,oldPrice:13990000,rating:4.6,sold:780,stock:20,icon:"📲",color:"#2d4a3e",specs:{"Chip":"Exynos 1380","RAM":"8GB","Pin":"10090mAh","Màn hình":"12.4\" IPS 90Hz","Loa":"AKG Stereo"}},
      { id:9,name:"PC Gaming Ryzen 7 / RTX 4060 / 32GB",category:"pc",price:24990000,oldPrice:27990000,rating:4.8,sold:210,stock:2,icon:"🖥️",color:"#3a2f52",specs:{"CPU":"Ryzen 7 7700","GPU":"RTX 4060 8GB","RAM":"32GB DDR5","Ổ cứng":"1TB NVMe","Nguồn":"650W Bronze","Loa":"Onboard 7.1"}},
      { id:10,name:"iMac 24\" M3 8GB/256GB",category:"pc",price:33990000,oldPrice:null,rating:4.8,sold:95,stock:0,icon:"🖥️",color:"#4d5b70",specs:{"Chip":"Apple M3","RAM":"8GB","Màn hình":"24\" 4.5K Retina","Loa":"6 loa Spatial Audio","Camera":"1080p Center Stage"}},
      { id:11,name:"PC Đồ họa Core i9 / RTX 4070 Ti",category:"pc",price:58990000,oldPrice:64990000,rating:4.9,sold:60,stock:4,icon:"🖥️",color:"#503048",specs:{"CPU":"i9-14900K","GPU":"RTX 4070 Ti 12GB","RAM":"64GB DDR5","Ổ cứng":"2TB NVMe"}},
      { id:12,name:"Bàn phím cơ AKKO 5075B Plus",category:"gear",price:1690000,oldPrice:2190000,rating:4.7,sold:3400,stock:30,icon:"⌨️",color:"#3d3560",specs:{"Switch":"Akko Cream Yellow V3","Layout":"75% (81 phím)","Kết nối":"BT5.0/2.4G/USB-C","Pin":"3000mAh","LED":"RGB"}},
      { id:13,name:"Chuột Logitech G Pro X Superlight 2",category:"gear",price:2890000,oldPrice:3490000,rating:4.9,sold:1800,stock:1,icon:"🖱️",color:"#25384a",specs:{"Cảm biến":"HERO 2 32K DPI","Nặng":"60g","Pin":"95h","Kết nối":"LIGHTSPEED"}},
      { id:14,name:"Tai nghe HyperX Cloud III",category:"gear",price:2390000,oldPrice:2990000,rating:4.8,sold:2600,stock:0,icon:"🎮",color:"#46303a",specs:{"Driver":"53mm","Mic":"10mm khử ồn","Kết nối":"3.5mm/USB","Loa":"DTS Headphone:X"}},
      { id:15,name:"Màn hình LG UltraGear 27\" 240Hz",category:"gear",price:7890000,oldPrice:9490000,rating:4.8,sold:520,stock:7,icon:"🖲️",color:"#2c4038",specs:{"Kích thước":"27\" Fast IPS","Độ phân giải":"2560x1440 QHD","Tần số":"240Hz 1ms"}},
      { id:16,name:"AirPods Pro 2 (USB-C)",category:"accessory",price:5390000,oldPrice:6290000,rating:4.9,sold:4100,stock:25,icon:"🎧",color:"#374151",specs:{"Chip":"H2","Pin":"6h (30h case)","Chống ồn":"ANC","Loa":"Spatial Audio"}},
      { id:17,name:"Sạc nhanh Anker 65W GaN 3 cổng",category:"accessory",price:1090000,oldPrice:1390000,rating:4.8,sold:5300,stock:2,icon:"🔌",color:"#4a3b2a",specs:{"Công suất":"65W GaNPrime","Cổng":"2x USB-C + USB-A"}},
      { id:18,name:"Ổ cứng SSD Samsung 990 PRO 1TB",category:"accessory",price:3290000,oldPrice:4190000,rating:4.9,sold:2900,stock:0,icon:"💾",color:"#2a3f52",specs:{"Dung lượng":"1TB","Chuẩn":"NVMe PCIe 4.0","Tốc độ":"7450/6900 MB/s"}}
    ];

    let product=null;
    let allProducts=[];

    async function load(){
      try{
        const local = JSON.parse(localStorage.getItem("izumitech-products")||"null");
        allProducts = local && local.length ? local : DEFAULT_PRODUCTS;
      }catch{ allProducts=DEFAULT_PRODUCTS; }
      try{
        const r=await fetch(`${API}/api/products`);
        if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length) allProducts=d.map(p=>({...p,id:p._id||p.id})); }
      }catch{}
      product = allProducts.find(p=>String(p.id)===String(id));
      if(!product) { $("#productRoot").innerHTML=`<p style="padding:40px 0;text-align:center">Không tìm thấy sản phẩm 😢<br><a href="index.html" class="btn btn-primary" style="margin-top:12px">Về trang chủ</a></p>`; return; }
      render();
      renderRelated();
      renderComments();
      updateCartUI();
    }

    function stars(n){ return "★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n)); }

    function render(){
      const p=product;
      const disc = p.oldPrice ? Math.round((1-p.price/p.oldPrice)*100) : 0;
      const stockText = p.stock===0 ? `<span style="color:var(--danger);font-weight:700">● Hết hàng</span>` : (p.stock<5 ? `<span style="color:var(--warning);font-weight:700">● Sắp hết (còn ${p.stock})</span>` : `<span style="color:var(--accent)">● Còn hàng (${p.stock})</span>`);
      document.title = `${p.name} — IzumiTech`;
      $("#productRoot").innerHTML=`
        <div class="product-page">
          <div class="product-gallery">
            <div class="main-media" style="background:linear-gradient(145deg, ${p.color}, var(--surface))">
              ${p.image ? `<img src="${p.image}" alt="${p.name}" />` : p.icon}
              ${disc?`<span class="card-badge" style="top:12px;left:12px">-${disc}%</span>`:""}
            </div>
          </div>
          <div class="product-info">
            <span style="color:var(--accent);font-weight:700;font-size:0.82rem;text-transform:uppercase">${p.category}</span>
            <h1>${p.name}</h1>
            <div class="product-meta"><span class="stars">${stars(p.rating)}</span><span>${p.rating}</span><small>· Đã bán ${p.sold.toLocaleString("vi-VN")} · ${stockText}</small></div>
            <div class="product-price-box">
              <div><span class="price">${vnd(p.price)}</span> ${p.oldPrice?`<span class="price-old" style="margin-left:8px">${vnd(p.oldPrice)}</span>`:""}</div>
              <small class="muted">Giá đã bao gồm VAT • Bảo hành 12 tháng • Trả góp 0%</small>
              <div class="product-actions">
                <button class="btn btn-primary" id="buyNow" ${p.stock===0?'disabled style="opacity:0.5"':''}>Mua ngay</button>
                <button class="btn btn-ghost" id="buyInstall">Mua trả góp 0%</button>
                <button class="btn btn-ghost" id="addCartBtn" ${p.stock===0?'disabled':''}>＋ Thêm vào giỏ</button>
              </div>
            </div>
            <div class="specs-box">
              <h3>⚙️ Thông số kỹ thuật</h3>
              <table class="specs-table">
                ${Object.entries(p.specs||{}).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("") || `<tr><td colspan="2" class="muted">Chưa có thông số chi tiết</td></tr>`}
              </table>
            </div>
            <ul class="product-desc">
              <li>Bảo hành chính hãng 12 tháng, 1 đổi 1 trong 30 ngày nếu lỗi</li>
              <li>Giao nhanh 2h nội thành HN/HCM, free ship đơn từ 500K</li>
              <li>Trả góp 0% qua thẻ tín dụng hoặc duyệt online chỉ cần CCCD</li>
              <li>Tặng kèm dán màn hình / vệ sinh miễn phí trọn đời máy</li>
            </ul>
          </div>
        </div>
        <div class="comments">
          <h3>💬 Đánh giá & bình luận</h3>
          <div class="comment-form">
            <div style="display:flex;gap:10px">
              <input type="text" id="cName" placeholder="Tên của bạn" style="flex:1" />
              <select id="cRating"><option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option><option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option></select>
            </div>
            <textarea id="cText" rows="3" placeholder="Chia sẻ cảm nhận của bạn về sản phẩm..."></textarea>
            <button class="btn btn-primary" id="cSubmit">Gửi đánh giá</button>
          </div>
          <div class="comment-list" id="cList"></div>
        </div>
        <div class="related" id="related"></div>
      `;
      $("#buyNow").addEventListener("click", ()=> doBuy(true));
      $("#addCartBtn").addEventListener("click", ()=> doBuy(false));
      $("#buyInstall").addEventListener("click", ()=>{
        toast("Trả góp 0%: trả trước 30%, còn lại chia 6-12 tháng. Gọi 1900 6868 để duyệt hồ sơ 5 phút 💳");
      });
      $("#cSubmit").addEventListener("click", submitComment);
    }

    function doBuy(isNow){
      if(product.stock===0){ toast("Sản phẩm đã hết hàng 😢"); return; }
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      const key=String(product.id);
      cart[key]= cart[key] ? {qty:cart[key].qty+1} : {qty:1};
      localStorage.setItem("izumitech-cart",JSON.stringify(cart));
      updateCartUI();
      if(isNow){
        toast(`Đã thêm "${product.name}" — đang chuyển tới giỏ hàng...`);
        setTimeout(()=> document.getElementById("cartDrawer")?.classList.add("open"),300);
      } else toast(`Đã thêm "${product.name}" vào giỏ 🛒`);
    }

    function getComments(){
      try{ return JSON.parse(localStorage.getItem(`izumitech-comments-${id}`)||"[]"); }catch{ return []; }
    }
    function renderComments(){
      const list=getComments();
      const box=$("#cList");
      if(!list.length){ box.innerHTML=`<p class="muted">Chưa có bình luận nào — hãy là người đầu tiên! ✨</p>`; return; }
      box.innerHTML=list.map(c=>`
        <div class="comment-item">
          <div class="c-head"><span class="c-avatar">${c.name[0].toUpperCase()}</span><div><b>${c.name}</b><div class="c-stars">${stars(c.rating)} · ${new Date(c.date).toLocaleDateString("vi-VN")}</div></div></div>
          <p>${c.text}</p>
        </div>`).join("");
    }
    function submitComment(){
      const name=$("#cName").value.trim() || "Khách";
      const rating=Number($("#cRating").value);
      const text=$("#cText").value.trim();
      if(!text){ toast("Vui lòng nhập nội dung bình luận"); return; }
      const list=getComments();
      list.unshift({name,rating,text,date:new Date().toISOString()});
      localStorage.setItem(`izumitech-comments-${id}`,JSON.stringify(list));
      $("#cText").value="";
      renderComments();
      toast("Cảm ơn đánh giá của bạn! 💙");
    }

    function renderRelated(){
      const rel = allProducts.filter(p=>p.category===product.category && String(p.id)!==String(product.id)).slice(0,4);
      if(!rel.length) return;
      $("#related").innerHTML=`<h3>🔗 Sản phẩm liên quan</h3><div class="product-grid">${rel.map(p=>`
        <article class="card" onclick="location.href='product.html?id=${p.id}'" style="cursor:pointer">
          <div class="card-media" style="background:linear-gradient(145deg, ${p.color}, var(--surface));overflow:hidden">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover"/>`:p.icon}</div>
          <div class="card-body"><span class="card-cat">${p.category}</span><h3 class="card-title">${p.name}</h3><div class="card-price-row"><span class="price">${vnd(p.price)}</span></div></div>
        </article>`).join("")}</div>`;
    }

    // cart drawer logic
    function updateCartUI(){
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      const count=Object.values(cart).reduce((s,q)=>s+(q.qty||0),0);
      const el=$("#cartCount"); if(el) el.textContent=count;
      const total=Object.entries(cart).reduce((s,[pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        return p?s+p.price*(q.qty||0):s;
      },0);
      const tc=$("#cartTotal"); if(tc) tc.textContent=vnd(total);
      const box=$("#cartItems");
      if(!box) return;
      const entries=Object.entries(cart);
      if(!entries.length){ box.innerHTML=`<p class="cart-empty">Giỏ hàng trống 😴</p>`; return; }
      box.innerHTML=entries.map(([pid,q])=>{
        const p=allProducts.find(x=>String(x.id)===String(pid));
        if(!p) return "";
        return `<div class="cart-item"><div class="ci-thumb" style="background:${p.color}">${p.icon}</div><div class="ci-info"><p class="ci-name">${p.name}</p><p class="ci-price">${vnd(p.price)} × ${q.qty}</p></div></div>`;
      }).join("");
    }
    let tt;
    function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }
    $("#cartBtn")?.addEventListener("click",()=>$("#cartDrawer").classList.add("open"));
    $("#closeCart")?.addEventListener("click",()=>$("#cartDrawer").classList.remove("open"));
    $("#overlay")?.addEventListener("click",()=>$("#cartDrawer").classList.remove("open"));
    $("#checkoutBtn")?.addEventListener("click",()=>{
      const cart=JSON.parse(localStorage.getItem("izumitech-cart")||"{}");
      if(!Object.keys(cart).length){ toast("Giỏ hàng trống 🙂"); return; }
      const total=Object.entries(cart).reduce((s,[pid,q])=>{ const p=allProducts.find(x=>String(x.id)===String(pid)); return p?s+p.price*(q.qty||0):s; },0);
      const orders=JSON.parse(localStorage.getItem("izumitech-orders")||"[]");
      const user=JSON.parse(localStorage.getItem("izumitech-user")||"null")||{name:"Khách",email:"guest@izumitech.vn"};
      orders.unshift({customerName:user.name,customerEmail:user.email,items:Object.entries(cart).map(([pid,q])=>{const p=allProducts.find(x=>String(x.id)===String(pid));return {product:pid,name:p?.name,price:p?.price,qty:q.qty}}),total,date:new Date().toISOString()});
      localStorage.setItem("izumitech-orders",JSON.stringify(orders));
      localStorage.setItem("izumitech-cart","{}");
      updateCartUI();
      toast(`Đặt hàng thành công! ${vnd(total)} 💙`);
      $("#cartDrawer").classList.remove("open");
    });

    load();
  </script>
</body>
</html>
